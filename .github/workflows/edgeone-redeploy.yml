name: EdgeOne Auto Redeploy

on:
  schedule:
    # GitHub 自带 schedule 在本仓库实测多次不触发（不可靠），仅作冗余备份
    # 实际每 2 小时触发由外部定时器（cron-job.org）调用 workflow_dispatch API 完成
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 允许手动触发 / 外部定时器调用 API 触发

env:
  TARGET_REPO: "1c7/chinese-independent-developer"
  TARGET_BRANCH: "master"

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # checkout / 读取仓库
      actions: read    # 允许跨 run 下载 artifact（download-artifact@v5 默认仅限当前 run）
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ─── 步骤1: 获取目标仓库最新 commit SHA ───
      - name: Get latest commit SHA from target repo
        id: get_sha
        run: |
          LATEST_SHA=$(curl -s -H "Accept: application/vnd.github.sha" \
            "https://api.github.com/repos/${{ env.TARGET_REPO }}/commits/${{ env.TARGET_BRANCH }}")
          echo "latest_sha=${LATEST_SHA}" >> $GITHUB_OUTPUT
          echo "Latest SHA: ${LATEST_SHA}"

      # ─── 步骤2: 找到上一次成功的运行，用于跨 run 取回 artifact ───
      # download-artifact@v5 默认只能下载“当前 run”的 artifact，必须显式指定 run-id
      - name: Find previous successful run
        id: prev_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 取同一 workflow、同一分支、最近一次“成功”的运行（排除当前运行）
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.name == "${{ github.workflow }}" and .head_branch == "${{ github.ref_name }}" and .conclusion == "success") | .id' \
            | grep -v "^${{ github.run_id }}$" | head -n1)
          echo "prev_run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "Previous run id: ${RUN_ID:-<none>}"

      # ─── 步骤2.5: 从“上一次运行”的 artifact 读取上次记录的 SHA ───
      - name: Restore last recorded SHA
        id: restore_sha
        if: steps.prev_run.outputs.prev_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: last-sha
          path: .
          run-id: ${{ steps.prev_run.outputs.prev_run_id }}
        continue-on-error: true   # 上一次运行未产生 artifact 时跳过（兜底：当首次部署处理）

      # ─── 步骤3: 对比 SHA，判断是否有更新 ───
      - name: Compare SHA and decide whether to deploy
        id: check_update
        run: |
          CURRENT_SHA="${{ steps.get_sha.outputs.latest_sha }}"

          if [ -f .last_sha ]; then
            LAST_SHA=$(cat .last_sha)
            echo "Last recorded SHA: ${LAST_SHA}"
          else
            echo "No previous SHA found (first run)"
            LAST_SHA=""
          fi

          if [ "${CURRENT_SHA}" != "${LAST_SHA}" ]; then
            echo "🔄 Repository has been updated!"
            echo "  Old SHA: ${LAST_SHA}"
            echo "  New SHA: ${CURRENT_SHA}"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No changes detected, skip deployment"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      # ─── 步骤4: 触发 EdgeOne Pages 部署钩子 ───
      - name: Trigger EdgeOne Pages Deploy Hook
        if: steps.check_update.outputs.should_deploy == 'true'
        run: |
          echo "🚀 Triggering EdgeOne Pages deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.EDGEONE_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json")
          echo "Deploy Hook Response Code: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "✅ Deployment triggered successfully"
          else
            echo "❌ Failed to trigger deployment (HTTP ${HTTP_CODE})"
            exit 1
          fi

      # ─── 步骤5: 更新记录的 SHA 并上传 artifact 持久化 ───
      - name: Update recorded SHA
        if: steps.check_update.outputs.should_deploy == 'true'
        run: |
          echo "${{ steps.get_sha.outputs.latest_sha }}" > .last_sha
          echo "Updated .last_sha to ${{ steps.get_sha.outputs.latest_sha }}"

      - name: Save recorded SHA to artifact
        if: steps.check_update.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: last-sha
          path: .last_sha
          overwrite: true
